<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2571b"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="320" fill="#14100b"/>

  <!-- keycaps: x0=52, width 100, gap 8, y=60..160 -->
  <g font-family="Noto Sans" font-weight="bold">
    <!-- safe caps -->
    <g stroke="#4a3c2e" stroke-width="5" fill="#1a1410">
      <rect x="160" y="60" width="100" height="100" rx="18"/>
      <rect x="376" y="60" width="100" height="100" rx="18"/>
      <rect x="484" y="60" width="100" height="100" rx="18"/>
      <rect x="592" y="60" width="100" height="100" rx="18"/>
      <rect x="700" y="60" width="100" height="100" rx="18"/>
      <rect x="916" y="60" width="100" height="100" rx="18"/>
      <rect x="1240" y="60" width="100" height="100" rx="18"/>
      <rect x="1348" y="60" width="100" height="100" rx="18"/>
    </g>
    <!-- affected caps -->
    <g stroke="url(#ember)" stroke-width="6" fill="#221710">
      <rect x="52"   y="60" width="100" height="100" rx="18"/>
      <rect x="268"  y="60" width="100" height="100" rx="18"/>
      <rect x="808"  y="60" width="100" height="100" rx="18"/>
      <rect x="1024" y="60" width="100" height="100" rx="18"/>
      <rect x="1132" y="60" width="100" height="100" rx="18"/>
    </g>

    <!-- shifted digits, top-left, dim -->
    <g font-size="28" fill="#6b5a45" text-anchor="middle">
      <text x="182" y="98">1</text>
      <text x="290" y="98">2</text>
      <text x="398" y="98">3</text>
      <text x="506" y="98">4</text>
      <text x="614" y="98">5</text>
      <text x="722" y="98">6</text>
      <text x="830" y="98">7</text>
      <text x="938" y="98">8</text>
      <text x="1046" y="98">9</text>
      <text x="1154" y="98">0</text>
      <text x="1262" y="98">°</text>
      <text x="1370" y="98">+</text>
    </g>

    <!-- base characters: safe -->
    <g font-size="46" fill="#7a6a55" text-anchor="middle">
      <text x="212" y="142">&amp;</text>
      <text x="428" y="142">"</text>
      <text x="536" y="142">'</text>
      <text x="644" y="142">(</text>
      <text x="752" y="142">-</text>
      <text x="968" y="142">_</text>
      <text x="1292" y="142">)</text>
      <text x="1400" y="142">=</text>
    </g>
    <!-- base characters: affected -->
    <g font-size="50" fill="#f6d7a8" text-anchor="middle">
      <text x="102" y="150" font-size="76">²</text>
      <text x="320"  y="142">é</text>
      <text x="860"  y="142">è</text>
      <text x="1076" y="142">ç</text>
      <text x="1184" y="142">à</text>
    </g>
  </g>

  <!-- legend -->
  <rect x="52" y="222" width="26" height="26" rx="6"
        fill="#221710" stroke="url(#ember)" stroke-width="4"/>
  <text x="96" y="243" font-family="Noto Sans" font-size="30" fill="#c9b799">
    bindings lost at every client restart
    <tspan fill="#ffa63e" font-weight="bold"> — EmberKeys brings them back</tspan>
  </text>
  <text x="52" y="292" font-family="Noto Sans" font-size="24" fill="#7a6a55">
    French AZERTY digit row (action buttons 1-12)
  </text>
</svg>
